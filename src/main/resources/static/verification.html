<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核销记录 - 优惠券管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="navbar">
    <div class="logo">优惠券管理系统</div>
    <div class="nav-links">
        <a href="/coupon.html">优惠券管理</a>
        <a href="/member.html">会员管理</a>
        <a href="/verification.html" class="active">核销记录</a>
    </div>
    <div class="user-info"><span id="userName"></span><a href="javascript:void(0)" onclick="logout()">退出</a></div>
</div>
<div class="container">
    <div class="card">
        <div class="search-bar">
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="searchPhone" placeholder="手机号">
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <input type="datetime-local" id="searchStartTime">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="datetime-local" id="searchEndTime">
            </div>
            <button class="btn btn-primary" onclick="loadData(1)">查询</button>
            <button class="btn" onclick="resetSearch()">重置</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户手机号</th>
                    <th>优惠券名称</th>
                    <th>核销码</th>
                    <th>核销人</th>
                    <th>核销时间</th>
                    <th>创建时间</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<script src="/js/common.js"></script>
<script>
Auth.checkLogin();
document.getElementById('userName').textContent = (Auth.getUser() || {}).nickname || '管理员';

let currentPage = 1;

function loadData(page) {
    currentPage = page || 1;
    const params = {
        pageNum: currentPage,
        pageSize: 10,
        phone: document.getElementById('searchPhone').value.trim() || undefined,
        startTime: document.getElementById('searchStartTime').value ? document.getElementById('searchStartTime').value.replace('T', ' ') + ':00' : undefined,
        endTime: document.getElementById('searchEndTime').value ? document.getElementById('searchEndTime').value.replace('T', ' ') + ':00' : undefined,
    };
    request.post('/api/v1/verification/admin/page', params).then(res => {
        renderTable(res.data.records);
        renderPagination(res.data);
    });
}

function renderTable(records) {
    const tbody = document.getElementById('tableBody');
    if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999">暂无数据</td></tr>';
        return;
    }
    tbody.innerHTML = records.map(r => `<tr>
        <td>${r.id}</td>
        <td>${r.memberPhone || '-'}</td>
        <td>${r.couponName || '-'}</td>
        <td><span class="tag tag-blue">${r.verificationCode || '-'}</span></td>
        <td>${r.verifier || '-'}</td>
        <td>${formatDate(r.verificationTime)}</td>
        <td>${formatDate(r.createTime)}</td>
    </tr>`).join('');
}

function renderPagination(page) {
    const total = page.total || 0;
    const pages = page.pages || 1;
    const current = page.current || 1;
    let html = `<span>共 ${total} 条</span><div class="page-btns">`;
    html += `<button ${current <= 1 ? 'disabled' : ''} onclick="loadData(${current - 1})">上一页</button>`;
    for (let i = 1; i <= pages; i++) {
        html += `<button class="${i === current ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
    }
    html += `<button ${current >= pages ? 'disabled' : ''} onclick="loadData(${current + 1})">下一页</button></div>`;
    document.getElementById('pagination').innerHTML = html;
}

function resetSearch() {
    document.getElementById('searchPhone').value = '';
    document.getElementById('searchStartTime').value = '';
    document.getElementById('searchEndTime').value = '';
    loadData(1);
}

function logout() { Auth.logout(); window.location.href = '/login.html'; }

loadData(1);
</script>
</body>
</html>
