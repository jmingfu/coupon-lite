<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 优惠券管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>优惠券管理系统</h2>
        <div id="loginForm">
            <div class="form-item">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" onclick="doLogin()">登 录</button>
            <div class="switch-link">还没有账号？<a href="javascript:void(0)" onclick="showRegister()">去注册</a></div>
        </div>
        <div id="registerForm" style="display:none">
            <div class="form-item">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" id="regUsername" placeholder="字母数字下划线，4-20位">
            </div>
            <div class="form-item">
                <label>密码 <span class="required">*</span></label>
                <input type="password" id="regPassword" placeholder="6-20位">
            </div>
            <div class="form-item">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="选填">
            </div>
            <button class="btn btn-primary" onclick="doRegister()">注 册</button>
            <div class="switch-link">已有账号？<a href="javascript:void(0)" onclick="showLogin()">去登录</a></div>
        </div>
    </div>
</div>
<script src="/js/common.js"></script>
<script>
if (Auth.isLoggedIn()) {
    window.location.href = '/coupon.html';
}

function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
}

function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
}

function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) { showToast('请填写用户名和密码', 'error'); return; }
    request.post('/api/v1/admin/login', { username, password }).then(res => {
        Auth.setToken(res.data.token);
        Auth.setUser(res.data);
        window.location.href = '/coupon.html';
    }).catch(err => showToast(err.message, 'error'));
}

function doRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    if (!username || !password) { showToast('请填写用户名和密码', 'error'); return; }
    request.post('/api/v1/admin/register', { username, password, phone: phone || undefined }).then(res => {
        showToast('注册成功，请登录', 'success');
        showLogin();
        document.getElementById('username').value = username;
    }).catch(err => showToast(err.message, 'error'));
}

function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
